<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>New Order</h2>
    <form th:action="@{/orders}" th:object="${order}" method="post">
        <div class="mb-3">
            <label class="form-label">Customer Name</label>
            <input class="form-control" th:field="*{customerName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Shipping Address</label>
            <input class="form-control" th:field="*{shippingAddress}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Total Amount</label>
            <input class="form-control" type="number" step="0.01" th:field="*{totalAmount}" required>
        </div>
        <button class="btn btn-success" type="submit">Save</button>
        <a class="btn btn-secondary" th:href="@{/orders}">Cancel</a>
    </form>
</body>
</html>
