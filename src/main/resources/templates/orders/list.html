<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
    <h2>Orders</h2>
    <a class="btn btn-primary mb-3" th:href="@{/orders/new}">+ New Order</a>
    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr><th>Order No</th><th>Customer</th><th>Amount</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
                <tr th:each="o : ${orders}">
                    <td th:text="${o.orderNumber}"></td>
                    <td th:text="${o.customerName}"></td>
                    <td th:text="${o.totalAmount}"></td>
                    <td th:text="${o.status}"></td>
                    <td>
                        <form th:action="@{/orders/{id}/delete(id=${o.id})}" method="post">
                            <button class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
